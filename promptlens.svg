<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1e2e"/>
      <stop offset="100%" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="lens" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#6ea8fe"/>
      <stop offset="100%" stop-color="#4a7bf7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b95a5"/>
      <stop offset="100%" stop-color="#5a6370"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="4" y="4" width="504" height="504" rx="108" ry="108" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Magnifying glass lens (circle) -->
  <circle cx="228" cy="218" r="128" fill="none" stroke="url(#lens)" stroke-width="28" stroke-linecap="round"/>

  <!-- Lens glass fill with subtle gradient -->
  <circle cx="228" cy="218" r="112" fill="rgba(74,123,247,0.08)"/>

  <!-- Lens shine highlight -->
  <ellipse cx="200" cy="178" rx="56" ry="36" fill="url(#shine)" transform="rotate(-25 200 178)"/>

  <!-- Data lines inside lens -->
  <line x1="168" y1="190" x2="288" y2="190" stroke="#6ea8fe" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  <line x1="168" y1="218" x2="260" y2="218" stroke="#6ea8fe" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
  <line x1="168" y1="246" x2="240" y2="246" stroke="#6ea8fe" stroke-width="10" stroke-linecap="round" opacity="0.35"/>

  <!-- Handle -->
  <line x1="324" y1="316" x2="408" y2="400" stroke="url(#handle)" stroke-width="32" stroke-linecap="round"/>

  <!-- Handle shine -->
  <line x1="328" y1="312" x2="390" y2="374" stroke="rgba(255,255,255,0.12)" stroke-width="10" stroke-linecap="round"/>
</svg>
