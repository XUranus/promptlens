[package]
name = "promptlens"
version = "0.3.1"
description = "Local-first LLM JSONL audit log viewer"
authors = ["PromptLens"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "promptlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
base64 = "0.22.1"
dirs = "6.0.0"
infer = "0.19.0"
rfd = "0.15.4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.9.2", features = [] }
time = { version = "0.3.44", features = ["formatting"] }

[dev-dependencies]
tempfile = "3.23.0"
